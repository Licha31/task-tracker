[project]
name = "task-tracker-backend"
version = "0.1.0"
description = "FastAPI backend for the Payroll and Sales Tax task tracker"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "holidays>=0.103",
    "itsdangerous>=2.2",
    "python-dateutil>=2.9.0.post0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
